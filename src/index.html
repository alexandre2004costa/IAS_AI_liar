<!doctype html>
<html>
  <head>
    <style>
      body {
        margin: 0;
        padding: 0;
        display: flex;
        height: 100vh;
        background: linear-gradient(135deg, #0a0a0a 0%, #1a0505 50%, #0a0a0a 100%);
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        color: #e0e0e0;
      }
      
      .column {
        flex: 1;
        display: flex;
        flex-direction: column;
        background-color: rgba(0, 0, 0, 0.4);
        box-shadow: inset 0 0 20px rgba(139, 0, 0, 0.1);
      }
      
      .left-column {
        border-right: 1px solid rgba(139, 0, 0, 0.3);
      }
      
      h3 {
        margin: 0;
        padding: 15px;
        color: #ff4d4d;
        font-weight: 600;
        text-shadow: 0 0 10px rgba(255, 77, 77, 0.5);
        background: linear-gradient(90deg, rgba(0, 0, 0, 0.8) 0%, rgba(50, 0, 0, 0.8) 100%);
        border-bottom: 1px solid rgba(255, 77, 77, 0.3);
        letter-spacing: 1px;
      }
      
      .left-content {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-height: 0;
      }
      
      #terminal {
        flex: 1;
        width: 100%;
        min-height: 200px;
        background: rgba(0, 0, 0, 0.6);
      }
      
      #reasoning-box {
        height: 40%;
        min-height: 300px;
        border-top: 1px solid rgba(139, 0, 0, 0.5);
        padding: 15px;
        overflow-y: auto;
        background: linear-gradient(180deg, rgba(10, 0, 0, 0.9) 0%, rgba(20, 0, 0, 0.8) 100%);
        color: #e0e0e0;
        box-shadow: inset 0 0 15px rgba(139, 0, 0, 0.2);
        flex-shrink: 0;
        display: flex;
        flex-direction: column;
      }
      
      #reasoning-box h3 {
        padding: 0 0 10px 0;
        margin: 0 0 10px 0;
        font-size: 14px;
        color: #ff6666;
        background: transparent;
        border-bottom: 1px solid rgba(255, 77, 77, 0.2);
        text-shadow: 0 0 5px rgba(255, 102, 102, 0.5);
        flex-shrink: 0;
      }
      
      /* Reasoning Box styles */
      .reasoning-message {
          margin-bottom: 15px;
          padding: 12px;
          background: rgba(0, 0, 0, 0.4);
          border-radius: 6px;
          border: 1px solid rgba(139, 0, 0, 0.3);
          box-shadow: 0 0 10px rgba(139, 0, 0, 0.1);
          flex: 1;
          overflow-y: auto;
      }

      .reasoning-prefix {
          color: #ff4d4d;
          font-weight: bold;
          font-size: 14px;
          margin-bottom: 8px;
          padding: 4px 8px;
          background: rgba(139, 0, 0, 0.2);
          border-radius: 4px;
          display: inline-block;
          text-shadow: 0 0 5px rgba(255, 77, 77, 0.3);
      }

      .reasoning-timestamp {
          color: #cc3333;
          font-size: 12px;
          margin-left: 8px;
      }

      .reasoning-text {
          color: #e0e0e0;
          font-size: 13px;
          line-height: 1.4;
      }
      
      .reasoning-text p {
          margin: 5px 0;
      }

      .reasoning-text ul, .reasoning-text ol {
          margin: 5px 0;
          padding-left: 20px;
      }

      .reasoning-text li {
          margin: 3px 0;
      }
      
      #ai-box {
        flex: 1;
        border: 1px solid rgba(139, 0, 0, 0.3);
        margin: 15px;
        padding: 15px;
        overflow-y: auto;
        background: linear-gradient(180deg, rgba(10, 10, 10, 0.9) 0%, rgba(20, 10, 10, 0.8) 100%);
        border-radius: 8px;
        box-shadow: 0 0 20px rgba(139, 0, 0, 0.2);
      }
      
      .input-container {
        display: flex;
        padding: 15px;
        background: linear-gradient(90deg, rgba(0, 0, 0, 0.8) 0%, rgba(50, 0, 0, 0.8) 100%);
        border-top: 1px solid rgba(139, 0, 0, 0.5);
      }
      
      #ai-input {
        flex: 1;
        padding: 12px 15px;
        border: 1px solid rgba(139, 0, 0, 0.5);
        border-radius: 25px;
        background: rgba(0, 0, 0, 0.7);
        color: #e0e0e0;
        font-size: 14px;
        outline: none;
        transition: all 0.3s ease;
        box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.5);
      }
      
      #ai-input:focus {
        border-color: #ff4d4d;
        background: rgba(0, 0, 0, 0.8);
        box-shadow: 0 0 0 2px rgba(255, 77, 77, 0.2), inset 0 0 10px rgba(0, 0, 0, 0.5);
      }
      
      #ai-input::placeholder {
        color: #888;
      }
      
      #send-button {
        margin-left: 10px;
        padding: 12px 20px;
        background: linear-gradient(135deg, #8b0000 0%, #cc0000 100%);
        color: #ffffff;
        border: 1px solid rgba(255, 77, 77, 0.3);
        border-radius: 25px;
        cursor: pointer;
        font-weight: 600;
        transition: all 0.3s ease;
        box-shadow: 0 0 15px rgba(139, 0, 0, 0.3);
        text-shadow: 0 0 5px rgba(255, 255, 255, 0.3);
      }
      
      #send-button:hover {
        background: linear-gradient(135deg, #cc0000 0%, #ff1a1a 100%);
        transform: translateY(-1px);
        box-shadow: 0 0 20px rgba(139, 0, 0, 0.5);
      }
      
      #send-button:active {
        transform: translateY(1px);
        box-shadow: 0 0 10px rgba(139, 0, 0, 0.3);
      }
      
      .user-message {
        margin-bottom: 15px;
        padding: 10px 15px;
        background: rgba(139, 0, 0, 0.1);
        border-radius: 18px;
        border-top-right-radius: 5px;
        color: #e0e0e0;
        align-self: flex-end;
        max-width: 80%;
        word-wrap: break-word;
        border: 1px solid rgba(139, 0, 0, 0.2);
      }
      
      .user-message .message-content {
        margin: 0;
      }
      
      .user-message .message-time {
        font-size: 11px;
        color: #888;
        text-align: right;
        margin-top: 5px;
      }
      
      /* Custom scrollbar styling */
      ::-webkit-scrollbar {
        width: 8px;
      }
      
      ::-webkit-scrollbar-track {
        background: rgba(0, 0, 0, 0.3);
      }
      
      ::-webkit-scrollbar-thumb {
        background: rgba(139, 0, 0, 0.5);
        border-radius: 4px;
      }
      
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(139, 0, 0, 0.7);
      }
      
      /* Center-screen global warning overlay */
      #global-warning {
          position: fixed;
          top: 50%;
          left: 50%;
          transform: translate(-50%, -50%);
          padding: 25px 35px;
          background: rgba(0, 0, 0, 0.9);
          border: 2px solid #ff4d4d;
          color: #ffcccc;
          font-size: 20px;
          font-weight: 700;
          text-align: center;
          letter-spacing: 0.5px;
          border-radius: 12px;
          backdrop-filter: blur(10px);
          box-shadow: 0 0 30px rgba(139, 0, 0, 0.7);
          z-index: 9999;
          opacity: 0;
          pointer-events: none;
          transition: opacity 0.35s ease;
          max-width: 70%;
      }

      /* Hidden state */
      #global-warning.hidden {
          opacity: 0;
      }

      /* Visible state */
      #global-warning.visible {
          opacity: 1;
      }
      
      /* AI Message styles - Enhanced for distinction */
.ai-message {
    margin-bottom: 15px;
    padding: 12px;
    border-radius: 8px;
    box-shadow: 0 0 10px rgba(139, 0, 0, 0.1);
}

/* AI Answer messages - more prominent */
.ai-message.answer {
    background: rgba(139, 0, 0, 0.15);
    border-left: 4px solid #ff4d4d;
}

/* AI Feedback messages - more subtle */
.ai-message.feedback {
    background: rgba(0, 0, 0, 0.3);
    border-left: 4px solid #8b0000;
}

.ai-prefix {
    font-weight: bold;
    padding: 3px 8px;
    border-radius: 4px;
    margin-right: 8px;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1px;
}

.ai-prefix-answer {
    color: #ffffff;
    background: linear-gradient(135deg, #8b0000 0%, #cc0000 100%);
    box-shadow: 0 0 10px rgba(139, 0, 0, 0.5);
}

.ai-prefix-feedback {
    color: #cc6666;
    background: rgba(139, 0, 0, 0.2);
    border: 1px solid rgba(139, 0, 0, 0.3);
}

.ai-content {
    display: inline;
    color: #e0e0e0;
    line-height: 1.5;
}

/* Add a subtle animation for new messages */
@keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}

.ai-message {
    animation: fadeIn 0.3s ease-out;
}
      .ai-separator {
          border: none;
          border-top: 1px solid rgba(139, 0, 0, 0.2);
          margin: 10px 0;
      }
    </style>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@4.19.0/css/xterm.css" />
    <script src="https://cdn.jsdelivr.net/npm/xterm@4.19.0/lib/xterm.js"></script>
  </head>
  <body>
    <div id="global-warning" class="hidden"></div>
    <div class="column left-column">
      <h3>Terminal</h3>
      <div class="left-content">
        <div id="terminal"></div>
        <div id="reasoning-box">
          <h3>AI Reasoning:</h3>
        </div>
      </div>
    </div>
    
    <div class="column right-column">
      <h3>AI Feedback:</h3>
      <div id="ai-box"></div> 
      <div class="input-container">
        <input type="text" id="ai-input" placeholder="Type your message here..." />
        <button id="send-button">Send</button>
      </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', function() {
        setTimeout(() => {
          const leftContent = document.querySelector('.left-content');
          if (leftContent) {
            leftContent.style.display = 'flex';
            leftContent.style.flexDirection = 'column';
            leftContent.offsetHeight;
          }
        }, 100);
      });
    </script>
    <script src="client.js"></script>
  </body>
</html>
